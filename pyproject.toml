[project]
name = "edge"
version = "0.1.0"
description = "Fantasy football weekly moves engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "requests>=2.31",
    "stripe>=15.6.1",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edge"]
