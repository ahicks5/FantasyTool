# Render blueprint (alternative to Railway). Free web service + persistent disk.
services:
  - type: web
    name: edge-api
    env: docker
    plan: free
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: EDGE_TRUST_PROXY
        value: "1"
      - key: EDGE_CORS
        value: https://ownerssuite.io,https://www.ownerssuite.io,https://penthousefantasy.com,https://www.penthousefantasy.com,https://fantasy-tool-alpha.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      # The owner's account is the admin. Comma-separated for more than one.
      - key: EDGE_ADMINS
        value: ahicks5.nd@gmail.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EDGE_WEB_URL
        value: https://ownerssuite.io
      # Stripe's no-code customer portal login link (not a secret), where a week-pass
      # subscriber manages or cancels. Enable the portal in the Stripe dashboard, then set
      # this on Render by hand; unset, the account page shows no "Manage or cancel" link.
      # - key: EDGE_BILLING_PORTAL_URL
      #   value: https://billing.stripe.com/p/login/...
      # Phone sign-in (docs/ACCOUNTS.md). Twilio Verify; the three secrets are set by hand.
      - key: EDGE_SMS_PROVIDER
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SID
        sync: false
      # Opens every paid feature for anyone, signed in or not. For clicking through a demo.
      # A real paywall bypass — unset it before anyone can be charged.
      - key: EDGE_DEMO_UNLOCK
        value: "0"
      # An ESPN league shows ESPN's own weekly projection (matches the ESPN app). Set to
      # "sleeper" to go back to re-scoring Sleeper's line for the week. Unset is on.
      # - key: EDGE_ESPN_PROJECTIONS
      #   value: sleeper
      # EDGE_DEV is deliberately absent. It makes the API accept an X-Edge-User header as
      # proof of identity, so any caller can claim to be any email. Never set it here.
