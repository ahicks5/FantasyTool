<!doctype html><html><head><meta charset="utf-8"><style>
    html,body{margin:0;background:#fff;color:#111;font-family:-apple-system,system-ui,'Segoe UI',Helvetica,Arial,sans-serif}
    .card{width:1080px;height:1080px;box-sizing:border-box;padding:72px;display:flex;flex-direction:column;justify-content:space-between;border:16px solid #0B6E4F}
    .top{display:flex;justify-content:space-between;align-items:baseline}
    .brand{font-weight:900;font-size:44px;letter-spacing:-1px}
    .sub{font-size:26px;color:#444}
    .verdict{font-size:150px;font-weight:900;letter-spacing:-5px;line-height:1;color:#0B6E4F;margin:24px 0 8px}
    .sides{display:flex;gap:32px;margin-top:24px}
    .side{flex:1;border:3px solid #111;border-radius:16px;padding:24px}
    .lbl{font-size:24px;color:#444;text-transform:uppercase;letter-spacing:2px}
    .names{font-size:44px;font-weight:800;margin:8px 0 12px;line-height:1.1}
    .delta{font-size:32px;font-weight:700}
    .why{font-size:32px;line-height:1.35;margin-top:24px}
    .foot{display:flex;justify-content:space-between;font-size:24px;color:#444}
    </style></head><body><div class="card">
    <div><div class="top"><div class="brand">edge</div><div class="sub">The Megalabowl · Week 2</div></div>
    <div class="verdict">Accept</div>
    <div class="sides">
      <div class="side"><div class="lbl">You give</div><div class="names">Jakobi Meyers</div><div class="delta" style="color:#0B6E4F">Your lineup +51 ROS</div></div>
      <div class="side"><div class="lbl">You get</div><div class="names">Jordan Mason</div><div class="delta" style="color:#0B6E4F">Their lineup +0 ROS</div></div>
    </div>
    <div class="why">Accept. Sending Jakobi Meyers for Jordan Mason lifts your starting lineup by 51 points rest of season. Their lineup moves +0.</div></div>
    <div class="foot"><div></div><div>Fairness 85%</div></div>
    </div></body></html>
